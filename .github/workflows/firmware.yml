# Firmware build: PlatformIO `esptube` env -> firmware.bin + the merged web-flasher image
# (docs/RECOVERY.md "Rebuilding the web-flasher image"). No hardware, no secrets, no flashing.
# Artifacts only; on a v* tag the two bins are also attached to a DRAFT GitHub Release.
# webflasher/firmware.merged.bin + manifest.json are NOT touched here: that bump stays a human step.
name: Firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  firmware:
    name: Build esptube firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only the draft-release step on a tag needs this; artifacts need read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scripts/gen_web_index.py stamps FW_VERSION from `git rev-parse`

      - name: Point PlatformIO's build dir at runner temp (platformio.ini hard-codes an absolute Mac path; the env var overrides it, ini untouched)
        run: echo "PLATFORMIO_BUILD_DIR=$RUNNER_TEMP/pio-build" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache the PlatformIO toolchain (espressif32@7.1.3 + Arduino core, ~hundreds of MB)
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/custom-fw/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO + esptool (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'platformio==6.2.0' 'esptool==5.4.0'
          pio --version
          esptool version

      - name: Version label (tag name, else short SHA)
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; else v="$(git rev-parse --short HEAD)"; fi
          echo "id=$v" >> "$GITHUB_OUTPUT"
          echo "version: $v"

      - name: Build (env esptube only; the other envs are measurement probes)
        run: pio run -d firmware/custom-fw -e esptube

      - name: Merge web-flasher image (docs/RECOVERY.md recipe, offsets 0x1000/0x8000/0xe000/0x10000)
        run: |
          set -euo pipefail
          D="$PLATFORMIO_BUILD_DIR/esptube"
          BA=$(ls ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin | head -1)
          mkdir -p out
          esptool --chip esp32 merge-bin -o out/firmware.merged.bin \
            --flash-mode dio --flash-freq 40m --flash-size 16MB \
            0x1000 "$D/bootloader.bin" 0x8000 "$D/partitions.bin" 0xe000 "$BA" 0x10000 "$D/firmware.bin"
          cp "$D/firmware.bin" out/firmware.bin
          cp webflasher/manifest.json out/manifest.json
          echo "== sizes =="
          ls -l "$D/bootloader.bin" "$D/partitions.bin" "$BA" out/
          echo "== sha256 =="
          sha256sum out/firmware.bin out/firmware.merged.bin

      - uses: actions/upload-artifact@v4
        with:
          name: esptube-firmware-${{ steps.ver.outputs.id }}
          path: |
            out/firmware.bin
            out/firmware.merged.bin
            out/manifest.json
          if-no-files-found: error

      - name: Attach bins to a DRAFT release for this tag (human publishes)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/firmware.bin
            out/firmware.merged.bin
