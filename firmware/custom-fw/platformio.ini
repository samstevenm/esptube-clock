; ============================================================================
; esptube-fw — custom firmware for a 6x ST7789 "Nixie-style" ESP32 tube clock
; Target: ESP32-D0WD (WROOM-32D), 16 MB flash, no PSRAM.
; ============================================================================
[platformio]
default_envs = esptube
; Extra measurement-only envs live in platformio-internal.ini (not published; absent = ignored).
extra_configs = platformio-internal.ini
; Build artifacts go to LOCAL disk (not this iCloud folder) so iCloud doesn't
; thrash on the tens-of-thousands of build files. Change if you like.
build_dir = /Users/sm/Developer/esptube-build

[env:esptube]
; Pin to the ALREADY-INSTALLED platform version so no re-download/mutation
; of the shared ~/.platformio toolchain happens.
platform  = espressif32@7.1.3
framework = arduino
board     = esp32dev

; ---- 16 MB flash configuration ----
board_upload.flash_size    = 16MB
board_build.flash_size     = 16MB
; Cap the app-size linker check at the 2 MB OTA slot size.
board_upload.maximum_size  = 2097152
board_build.partitions     = partitions_16mb_ota.csv
board_build.filesystem     = littlefs

; ---- Serial console (code only; nothing is flashed here) ----
monitor_speed = 115200

; ---- Pre-build: embed data/index.html into src/web_index.h (PROGMEM) so the
;      web control panel ships in the app image (no LittleFS upload needed). ----
extra_scripts =
    pre:scripts/gen_web_index.py

; ---- Project libraries ----
; TFT_eSPI is NOT listed here: we use EleksTubeHAX's PATCHED fork vendored at
; ./lib/modified_TFT_eSPI (its SPI works on Arduino-ESP32 core 3.x, where stock
; TFT_eSPI 2.5.43 leaves the panels backlit-but-blank). Listing bodmer/TFT_eSPI
; would create a duplicate TFT_eSPI.h; the local lib/ copy must win.
; The registry libs below download into ./.pio/libdeps (never the shared store).
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    ; Debounced click / double-click / multi-click (N clicks in a window) / long-press — a solved
    ; problem; used instead of a bespoke edge state machine so button menus are reliable and a
    ; single-button board (e.g. IPSTube H401) works via click-count. See buttons.cpp.
    mathertel/OneButton@^2.6.1

build_flags =
    ; ---------- TFT_eSPI User_Setup, supplied entirely via -D ----------
    ; Mirrors EleksTubeHAX's SI_HAI config (include/GLOBAL_DEFINES.h), which is
    ; confirmed-correct on this hardware: ST7789 135x240, TFT_CS=-1 (595 shift
    ; register does CS), CGRAM_OFFSET REQUIRED (without it content lands
    ; off-screen and the panels look blank). No explicit inversion (panel
    ; power-on default). Uses the vendored fork in lib/modified_TFT_eSPI.
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    ; CS is via a 74HC595 shift register (see tubes.cpp) — library must NOT own CS.
    -DTFT_CS=-1
    -DTFT_DC=16
    -DTFT_RST=23
    -DTOUCH_CS=-1
    ; Read/write on the MOSI/SDA pin (no separate MISO), as EleksTubeHAX SI_HAI.
    -DTFT_SDA_READ=1
    ; Fonts: FONT2/FONT4 (EleksTubeHAX) + FONT6 for the big self-test digit,
    ; GLCD/GFXFF for drawText fallbacks.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; SPI clocking (~40 MHz as spec'd, matching EleksTubeHAX SI_HAI).
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    ; ---------- App options ----------
    -DCORE_DEBUG_LEVEL=3

; ---- Experimental: 80 MHz panel SPI (ST7789 write spec ~62 MHz; many panels run 80).
;      Try with eyes on the glass (self-test + a raw565 push); fall back to `esptube` if
;      anything tears. Same code, only the clock differs.  pio run -e esptube_spi80
[env:esptube_spi80]
extends = env:esptube
build_flags = ${env:esptube.build_flags}
    -USPI_FREQUENCY -DSPI_FREQUENCY=80000000

; ---- measurement only: what a BLE stack (NimBLE + Nordic UART service) would cost ----
[env:esptube_bleprobe]
extends = env:esptube
lib_deps =
    ${env:esptube.lib_deps}
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    ${env:esptube.build_flags}
    -DESPTUBE_BLE_PROBE
